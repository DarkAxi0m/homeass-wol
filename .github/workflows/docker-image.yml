name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: set_tag
        run: echo "image_tag=$(date +%s)" >> $GITHUB_OUTPUT
      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag  docker.io/darkaxi0m/homeass-wol:${{ steps.set_tag.outputs.image_tag }}
      - name: Push Docker image
        run: docker push  docker.io/darkaxi0m/homeass-wol:${{ steps.set_tag.outputs.image_tag }}
